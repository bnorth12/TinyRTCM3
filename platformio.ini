; Native host tests + optional ESP32 env later
[env:native_test]
platform = native
build_flags = -std=c++17 -I src
build_src_filter = +<*> -<../examples/>
test_build_src = true
test_filter = host/*

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_ldf_mode = deep+
build_flags = -std=gnu++17
