name: host-verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run runSelfTests
        run: |
          g++ -std=c++17 -Wall -Wextra -I src \
            -o build_self_tests \
            src/TinyRtcmVerify.cpp src/TinyRtcmCodec.cpp \
            test/host/test_self_tests.cpp
          ./build_self_tests
