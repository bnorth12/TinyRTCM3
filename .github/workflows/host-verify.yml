name: host-verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No LC29H_GNSS dependency in library sources or examples
        shell: bash
        run: |
          if grep -rnE '#include *[<"]LC29H|LC29H_GNSS::|LC29H_UartPump|LC29H_Rtcm' src examples library.properties library.json; then
            echo "TinyRTCM3 must not depend on LC29H_GNSS."
            exit 1
          fi
  self-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -I src \
            -o build_self_tests \
            src/TinyRtcmVerify.cpp src/TinyRtcmCodec.cpp src/TinyRtcmSanitize.cpp \
            test/host/test_self_tests.cpp
          ./build_self_tests
          g++ -std=c++17 -Wall -Wextra -I src \
            -o build_crc_assembler \
            test/host/test_crc_assembler.cpp
          ./build_crc_assembler
          g++ -std=c++17 -Wall -Wextra -I src \
            -o build_bitbuffer_codec \
            src/TinyRtcmCodec.cpp \
            test/host/test_bitbuffer_codec.cpp
          ./build_bitbuffer_codec
